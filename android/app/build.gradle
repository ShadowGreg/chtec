plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.chtec'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.chtec'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }
}
